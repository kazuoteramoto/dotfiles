name: install-test
on:
  pull_request:
  push:
    branches: [master]

jobs:
  install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"

      - name: Render install script
        run: chezmoi execute-template < run_onchange_install-packages.sh.tmpl > /tmp/install.sh

      - name: Run install
        run: bash /tmp/install.sh

      - name: Install zsh (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Apply dotfiles (zsh only)
        run: chezmoi apply -S "$GITHUB_WORKSPACE" ~/.zshenv ~/.zsh

      - name: First run of zsh (antidote bootstrap)
        run: |
          export TERM=xterm
          unset PAGER
          zsh -i -c 'true'
          zsh -i -c 'true'   # second run — bootstrap must be idempotent
          test -f ~/.zsh/.zsh_plugins.zsh
          grep -q zsh-autosuggestions ~/.zsh/.zsh_plugins.zsh
          grep -q fast-syntax-highlighting ~/.zsh/.zsh_plugins.zsh

      - name: Verify tools (linux)
        if: runner.os == 'Linux'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          for t in nvim starship eza rg zoxide bat delta git-wt; do
            command -v "$t" >/dev/null || { echo "missing: $t"; exit 1; }
          done

      - name: Verify tools (macos)
        if: runner.os == 'macOS'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          for t in nvim starship eza rg zoxide bat delta git-wt wget; do
            command -v "$t" >/dev/null || { echo "missing: $t"; exit 1; }
          done
          test -x "$(brew --prefix)/bin/bash"
